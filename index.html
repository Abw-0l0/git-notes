<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F1E1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GitNotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>GitNotes</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- LIST VIEW -->
  <section id="listView" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="bar">
      <h1 id="repoTitle">GitNotes<small id="repoSub"></small></h1>
      <button class="ibtn" id="syncBtn" aria-label="Sync notes" title="Sync">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5M20 20v-4h-4"/></svg>
      </button>
      <button class="ibtn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div class="search"><input id="search" type="search" placeholder="Search notes by name" autocomplete="off"></div>
    <div class="list" id="list"></div>
    <button class="fab" id="newBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New note</button>
  </section>

  <!-- EDITOR VIEW -->
  <section id="editView" style="display:none;flex-direction:column;flex:1;min-height:0">
    <header class="bar">
      <button class="ibtn" id="backBtn" aria-label="Back to notes">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="noteTitle">Note<small id="notePath"></small></h1>
      <div class="seg" role="group" aria-label="Mode">
        <button id="modeEdit" class="on">Edit</button>
        <button id="modeView">Read</button>
      </div>
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="ibtn" id="moreBtn" aria-label="More actions">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
      </button>
    </header>
    <div class="status"><span id="statusText"></span><span id="statusRight"></span></div>
    <div class="editor">
      <textarea id="text" spellcheck="true" autocapitalize="sentences" placeholder="Start writing…"></textarea>
      <div id="preview" class="preview hidden"></div>
      <div class="tools" id="tools">
        <button data-a="h" aria-label="Heading">H</button>
        <button data-a="b" aria-label="Bold"><b>B</b></button>
        <button data-a="i" aria-label="Italic"><i>I</i></button>
        <button data-a="ul" aria-label="Bullet list">• List</button>
        <button data-a="task" aria-label="Checklist">☐ Task</button>
        <button data-a="quote" aria-label="Quote">“ ”</button>
        <button data-a="code" aria-label="Code">&lt;/&gt;</button>
        <button data-a="link" aria-label="Link">Link</button>
        <button data-a="date" aria-label="Insert date">Date</button>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settingsView" class="sheet hidden">
    <header class="bar">
      <button class="ibtn" id="settingsBack" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Settings</h1>
    </header>
    <div class="form">
      <div id="settingsMsg" class="msg hidden"></div>
      <div class="field">
        <label for="fRepo">Repository</label>
        <input id="fRepo" placeholder="https://github.com/you/notes  or  you/notes" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="hint">A GitHub URL or owner/name.</div>
      </div>
      <div class="field">
        <label for="fToken">Personal access token</label>
        <input id="fToken" type="password" placeholder="github_pat_…" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="hint" id="fTokenHint"></div>
        <div class="hint">Create a fine-grained token limited to this one repo with <b>Contents: Read and write</b>.
          <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create token</a>.
          It is stored only on this device.</div>
      </div>
      <div class="field">
        <label for="fBranch">Branch</label>
        <input id="fBranch" placeholder="Leave empty for the default branch" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="fFolder">Notes folder</label>
        <input id="fFolder" placeholder="Leave empty to show the whole repo" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="hint">Only files inside this folder are listed, for example <code>notes</code>.</div>
      </div>
      <div class="field">
        <label for="fTheme">Theme</label>
        <select id="fTheme"><option value="auto">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </div>
      <div class="row">
        <button class="btn primary" id="saveSettings">Save and connect</button>
        <button class="btn danger" id="clearData">Sign out and clear data</button>
      </div>
    </div>
  </section>

  <div class="menu hidden" id="menu">
    <button id="mRename">Rename or move</button>
    <button id="mReload">Reload from repo</button>
    <button id="mDelete" class="danger">Delete note</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
